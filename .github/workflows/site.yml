name: Site

# Site build gate. Publishing is intentionally owned by the unified Platform CI
# workflow and is allowed only after every platform gate passes.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (server + web) & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build server (tsc)
        run: pnpm --filter @mta-market/server build
      - name: Build web (next build)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: pnpm --filter @mta-market/web build
