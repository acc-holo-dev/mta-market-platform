name: Site

# Site build gate (lint, type-check, builds, runtime smoke). Reusable only:
# Platform CI (ci.yml) is the single push/PR entry point, so this gate never
# runs twice for the same change.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check, build & runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check (workspaces + tests)
        run: pnpm type-check
      - name: Build server (tsc)
        run: pnpm --filter @mta-market/server build
      - name: Production runtime smoke (node dist/)
        working-directory: site/server
        env:
          # The dist runtime must fail FAST with a clear reason when required
          # production secrets are absent (startup policy), not crash with an
          # ERR_MODULE_NOT_FOUND — this is the PLAN-012 §21A gate.
          NODE_ENV: production
        run: |
          set +e
          node dist/index.js > dist-smoke.log 2>&1
          code=$?
          cat dist-smoke.log
          if [ "$code" -eq 0 ]; then
            echo "::error::production runtime started without required secrets (startup policy violated)"
            exit 1
          fi
          if ! grep -q "module not found\|ERR_MODULE_NOT_FOUND" dist-smoke.log; then
            echo "dist runtime smoke: clean fail-fast confirmed (exit $code, no module resolution errors)"
            exit 0
          fi
          echo "::error::dist emit has unresolved imports (ERR_MODULE_NOT_FOUND)"
          exit 1
      - name: Build web (next build)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: pnpm --filter @mta-market/web build
