name: Contracts

# contracts/ is the machine-readable source for API/DRM/module/events.
# Every file must parse; this is a blocking gate.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: contracts/ syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: bash scripts/maintenance/verify-contracts.sh
