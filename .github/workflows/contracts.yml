name: Contracts

# Reusable machine-readable contract validation gate. Platform CI is the
# public entry point.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: contracts/ syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: bash scripts/maintenance/verify-contracts.sh
