name: Release

# Tag-driven release. A release is allowed only after the complete unified
# platform gate passes: validation, contracts, security, tests, module, site,
# and browser E2E. Publishing happens only after that gate.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  gate:
    name: Full platform release gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish release images + module package
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image (release tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/site/server.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ github.ref_name }}
          labels: org.opencontainers.image.version=${{ github.ref_name }}
      - name: Frontend image (release tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/site/web.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ github.ref_name }}
          labels: org.opencontainers.image.version=${{ github.ref_name }}
      - name: Package the module (CPack ZIP)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build g++ libssl-dev
          cmake --preset linux-gcc -S module
          cmake --build --preset linux-gcc -S module
          ctest --preset linux-gcc --test-dir module --output-on-failure
          cd module/build/linux-gcc && cpack
      - name: Attach module package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: module/build/linux-gcc/package/*.zip
          generate_release_notes: true
