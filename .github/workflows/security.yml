name: Security

# Reusable secret and dependency security gate. Platform CI is the public
# entry point.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit (high/critical gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # PLAN-020 O-002: pnpm/action-setup must precede setup-node so the
      # store cache resolves; cache:'pnpm' removes a full install per run.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/maintenance/audit.sh
