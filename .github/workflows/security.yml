name: Security

# Secret scan + dependency audit gate (PLAN-004 G-002/K-002 policy kept:
# HIGH/CRITICAL production advisories fail; waivers in
# .github/audit-exceptions.txt with review dates).

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit (high/critical gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/maintenance/audit.sh
