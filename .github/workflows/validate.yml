name: Validate

# Reusable repository policy gate. Platform CI is the public entry point.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    name: Repository policy (documents zone, naming, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No duplicate structure roots
        run: |
          bad=""
          for top in documents contracts site module tests logs scripts config infrastructure; do
            [ -d "$top" ] || { echo "::error::missing foundation directory: $top/"; bad=1; }
          done
          for d in site/docs site/tests module/docs module/tests docs tests/site/src infra configurations; do
            [ -d "$d" ] && { echo "::error::forbidden duplicate directory: $d/"; bad=1; }
          done
          [ -z "$bad" ] || exit 1
      - name: No stray markdown next to sources
        run: |
          ! find module/src module/tools tests scripts config infrastructure -name '*.md' | grep -q . \
            || { echo "::error::.md next to sources found"; exit 1; }
      - name: Shell scripts are executable and parse
        run: |
          for f in scripts/**/*.sh; do
            bash -n "$f" || { echo "::error::bash -n failed: $f"; exit 1; }
          done
      - name: startup.py compiles
        run: python3 -m py_compile startup.py scripts/development/*.py
      - name: Single test root (no stray tests outside tests/)
        run: |
          bad=$(git ls-files '*test*' '*spec*' \
            | grep -Ev '^tests/' \
            | grep -Ev '^scripts/tests/' \
            | grep -Ev '^\.github/workflows/' \
            | grep -Ev '(^|/)(vitest|playwright)\.config\.(ts|js)$' \
            | grep -Ev '^config/|^infrastructure/|^tsconfig\.test\.json$' \
            | grep -Ev '(^|/)test[_-]harness\.(py|cjs|cts|mjs)$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::test files outside tests/ are forbidden (PLAN-012 §3):"
            echo "$bad"
            exit 1
          fi
      - name: Logs policy (root logs/ convention only)
        run: |
          tracked_logs=$(git ls-files '*.log' '*.log.*' || true)
          if [ -n "$tracked_logs" ]; then
            echo "::error::runtime log files must never be tracked:"
            echo "$tracked_logs"
            exit 1
          fi
          for d in log site/logs module/logs; do
            [ -d "$d" ] && { echo "::error::forbidden log root: $d/"; exit 1; }
          done
          [ -d logs ] || { echo "::error::missing foundation directory: logs/"; exit 1; }
      - name: Markdown policy — GitHub-technical exceptions recorded
        run: |
          # The single allowed .md outside documents/ is the GitHub PR template.
          bad=$(git ls-files '*.md' | grep -v '^documents/' | grep -v '^\.github/pull_request_template\.md$' || true)
          if [ -n "$bad" ]; then
            echo "::error::.md files outside documents/ (except the recorded .github/pull_request_template.md exception):"
            echo "$bad"
            exit 1
          fi
