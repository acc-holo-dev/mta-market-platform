# Development environment — site component (web + server).
# Source of truth: environment variables (.env). This manifest mirrors the
# intended dev values for review/diff purposes. No secrets here.
api:
  port: 3001
  nodeEnv: development
  baseUrl: http://localhost:3001
  frontendUrl: http://localhost:3000
  corsOrigins: [http://localhost:3000]
  cookieSameSite: lax
  trustProxy: true
web:
  port: 3000
  publicApiUrl: http://localhost:3001
database:
  # dev credentials are intentionally non-secret (local containers only)
  host: 127.0.0.1
  port: 5432
  db: mtamarket
  user: mtamarket
  passwordEnv: POSTGRES_PASSWORD   # value lives in .env, never here
redis:
  url: redis://127.0.0.1:6379
storage:
  s3Enabled: false
  uploadDir: ./uploads
rateLimits:
  auth: 10000        # loose for local E2E runs
  standard: 10000
  strict: 10000
jobs:
  reconciliationEnabled: true
  serverMonitoringEnabled: true
