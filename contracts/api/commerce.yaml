# Commerce domain inventory (routes: purchases, payments, services, disputes)
# PLAN-012 §21D/§23: inventory completed against routes (2026-09-11) —
# purchase detail, cancel/refunds, service lifecycle, dispute transition.
domain: commerce
endpoints:
  purchases:
    - { method: POST, path: /purchases, note: checkout; optional discountCode; free = instant license; honors Idempotency-Key (PLAN-012 §5) }
    - { method: GET,  path: /purchases/my }
    - { method: GET,  path: /purchases/:id, note: owner-only detail }
  payments:
    - { method: GET,  path: /payments/providers, note: PLAN-016 discovery of enabled payment providers (confirmation type) }
    - { method: POST, path: /payments/create, note: explicit provider honored (validated against registry); default env PAYMENTS_DEFAULT_PROVIDER; honors Idempotency-Key }
    - { method: POST, path: /payments/webhook, note: backward-compatible alias -> default provider; idempotent (paymentProviderEvent) }
    - { method: POST, path: /payments/webhook/:provider, note: PLAN-016 P-002 per-provider webhook (raw-body HMAC / IP / Basic per provider) }
    - { method: POST, path: /payments/cancel, note: cancels a PENDING payment at ITS OWN provider (owner/admin) }
    - { method: POST, path: /payments/refunds, note: create refund (INV-013 ceiling); ADMIN only; honors Idempotency-Key; capability-gated (crypto providers do not expose refunds) }
    - { method: GET,  path: /payments/:paymentId/refunds, note: list refunds; ADMIN }
    - { method: POST, path: /payments/:id/simulate, note: DEV-ONLY; 404 in production, 403 when any provider is enabled outside production (A-005) }
  services:
    - { method: GET,  path: /services }
    - { method: GET,  path: /services/:slug }
    - { method: GET,  path: /services/my }
    - { method: POST, path: /services }
    - { method: PATCH, path: /services/:id, note: seller edit }
    - { method: POST, path: /services/:id/submit|publish|suspend, note: seller lifecycle }
    - { method: POST, path: /services/:slug/order }
    - { method: GET,  path: /services/orders/my }
    - { method: POST, path: /services/orders/:id/accept|cancel|close|deliver|dispute|revision }
    - { method: POST, path: /services/orders/:id/messages }
    - { method: GET,  path: /services/orders/:id/messages }
  disputes:
    - { method: POST, path: /disputes, note: one open dispute per order (DB invariant) }
    - { method: GET,  path: /disputes/my }
    - { method: GET,  path: /disputes/:id }
    - { method: POST, path: /disputes/:id/messages }
    - { method: POST, path: /disputes/:id/transition, note: admin state machine; CAS transition }
    - { method: GET,  path: /disputes/admin/all, auth: admin }
ledger:
  model: double-entry (LedgerAccount/LedgerEntry), platform fee on settlement
  transactions: [PAYMENT_RECEIVED, PLATFORM_FEE, SELLER_REVENUE, SELLER_PAYOUT, REFUND_TO_BUYER, REFUND_FROM_SELLER, ADJUSTMENT]
  reconciliation: daily job + ReconciliationReport/Mismatch
