events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # PLAN-004 H-005: websocket is not used by the application; keep-alive to
    # upstreams is preserved with a conditional Connection header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream servers
    upstream backend {
        server backend:3001;
    }

    upstream frontend {
        server frontend:3000;
    }

    # HTTP to HTTPS redirect.
    # PLAN-004 H-001: a generic `server_name _` + $host redirect allowed
    # Host-header injection (attacker-controlled redirect target). The
    # production domain is set via the SERVER_NAME env (nginx image supports
    # envsubst via templates; static default matches the compose default).
    # Unknown Hosts are dropped with 444.
    server {
        listen 80 default_server;
        server_name _;

        # Unknown Host (not the production domain): drop the connection.
        if ($host !~* ^(localhost|mtamarket\.local)$) {
            return 444;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Configuration (H-002)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # PLAN-004 H-003 (audit GAP-04): HSTS at the edge — applies to every
        # response (the backend only set it on /api). 1 year, includeSubDomains;
        # preload is deliberately NOT set until the domain is confirmed.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # PLAN-004 G-004 (audit GAP-01/10): strict CSP for the frontend HTML
        # (the previous policy allowed any https: source with
        # unsafe-inline/unsafe-eval — effectively no CSP), unified header set,
        # no deprecated X-XSS-Protection, X-Frame-Options aligned with the
        # backend (DENY). Permissions-Policy minimizes unused capabilities.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Max upload size (H-006: == backend multer limit)
        client_max_body_size 100M;

        # Health check (nginx-internal probe target)
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # API Backend
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Auth endpoints (stricter rate limit)
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://backend/auth/;
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PLAN-004 B-005/G-006 (audit GAP-05, P0 check): the /uploads/ proxy
        # location is REMOVED. Paid artifacts must only be reachable through
        # the authorized download route (entitlement-checked, short-lived
        # signed URLs) — never as a static proxy path. The backend has no
        # /uploads route; this location previously existed as a latent bypass
        # waiting for a static route to appear.

        # PLAN-003 A-002: public media (covers/screenshots) from the backend.
        # Only opaque media-<hex> names are servable (server-enforced).
        location /media/ {
            proxy_pass http://backend/media/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
            # Re-declare security headers: a location-level add_header
            # disables server-level header inheritance.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        # Frontend Next.js
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Next.js static files
        location /_next/static/ {
            proxy_pass http://frontend/_next/static/;
            proxy_http_version 1.1;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }
    }
}
