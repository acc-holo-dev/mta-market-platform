# Test infrastructure (integration test database, PLAN-010 centralized tests/).
# Usage: docker compose -f infrastructure/docker/compose/tests.yml up -d
#
# The vitest suite (vitest.config.ts) expects PostgreSQL on 127.0.0.1:5433
# (postgres/postgres) — override with TEST_DATABASE_URL. Redis tests reuse
# the development redis on 6379 (override with TEST_REDIS_URL).
#
# The compose project name isolates volumes from the development stack.

name: mta-market-tests

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: mta-market-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
