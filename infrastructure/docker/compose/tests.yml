# Test infrastructure (integration test database, disposable).
# Usage: docker compose -f infrastructure/docker/compose/tests.yml up -d
# or: python startup.py test integration (destroys the stack after the run).
#
# The vitest suite (vitest.config.ts) expects PostgreSQL on 127.0.0.1:5433
# (postgres/postgres) — override with TEST_DATABASE_URL. The host port is
# parameterized so a busy 5433 never blocks a run:
#   TEST_DB_HOST_PORT=5533 docker compose -f ... up -d
# Redis tests reuse the development redis on 6379 (override with
# TEST_REDIS_URL).
#
# The compose project name + dedicated volume namespace isolate test state
# from the development stack; volumes are disposable and removed after
# integration runs (python startup.py test integration).

name: mta-market-tests

services:
  postgres-test:
    image: postgres:16-alpine
    # Suffix parameterization lets parallel isolated runs (per-agent test
    # databases) coexist on one host without container-name collisions.
    container_name: mta-market-postgres-test${TEST_DB_SUFFIX:-}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${TEST_DB_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
