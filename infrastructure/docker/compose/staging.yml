# Staging compose — same topology as production.yml with staging-unique
# container names and ports so a staging stack can coexist with a local
# production rehearsal on one host.
#
# Staging consumes the same ghcr images as production (image tag supplied by
# the release pipeline) and reads .env.staging (never reuse production
# secrets — see config/ and documents/operations/STAGING.md).
#
# Usage:
#   cp .env.example .env.staging   # then fill STAGING values
#   docker compose -f infrastructure/docker/compose/staging.yml --env-file .env.staging up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: mta-market-staging-postgres
    restart: always
    environment:
      POSTGRES_DB: mtamarket
      POSTGRES_USER: ${POSTGRES_USER:-mtamarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mta-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mtamarket}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mta-market-staging-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - mta-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:${IMAGE_TAG:-latest}
    container_name: mta-market-staging-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mtamarket}:${POSTGRES_PASSWORD}@postgres:5432/mtamarket
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      DRM_SERVER_PRIVATE_KEY: ${DRM_SERVER_PRIVATE_KEY}
      DRM_MASTER_KEY: ${DRM_MASTER_KEY}
      ARTIFACT_SIGNING_PRIVATE_KEY: ${ARTIFACT_SIGNING_PRIVATE_KEY}
      BASE_URL: ${BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      UPLOAD_DIR: ./uploads
      S3_ENABLED: ${S3_ENABLED:-true}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      YOOKASSA_ENABLED: ${YOOKASSA_ENABLED:-false}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      YOOKASSA_NOTIFICATION_PASSWORD: ${YOOKASSA_NOTIFICATION_PASSWORD}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      LOG_FORMAT: json
      LOG_LEVEL: info
    volumes:
      - uploads_data:/app/uploads
    ports:
      - '3101:3001'
    networks:
      - mta-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:${IMAGE_TAG:-latest}
    container_name: mta-market-staging-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - '3100:3000'
    networks:
      - mta-network
    depends_on:
      - backend
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  mta-network:
    driver: bridge
